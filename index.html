<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fomery · 美食社群與寵物</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <header class="shell masthead">
    <a class="brand" href="./" aria-label="Fomery 首頁">Fomery</a>
    <p class="eyebrow">A LITTLE MORE YOU.</p>
    <h1>好好吃飯，<br>也好好記得。</h1>
    <p>你的口味，你的排行。<br>把每次喜歡，都收進口袋。</p>
    <nav aria-label="主要頁面">
      <button type="button" data-page="activity"><span aria-hidden="true">⌂</span> 動態</button>
      <button type="button" data-page="community"><span aria-hidden="true">♧</span> 好友與群組</button>
      <button type="button" data-page="gatherings"><span aria-hidden="true">♨</span> 聚餐</button>
      <button type="button" data-page="pets"><span aria-hidden="true">♙</span> 寵物</button>
      <button type="button" data-page="search"><span aria-hidden="true">⌕</span> 找店</button>
      <button type="button" data-page="lists"><span aria-hidden="true">☷</span> 我的清單</button>
      <button type="button" data-page="explore"><span aria-hidden="true">◎</span> 探索</button>
      <button type="button" data-page="profile"><span aria-hidden="true">◉</span> 個人</button>
    </nav>
    <div class="demo-tools"><span class="demo-badge">互動展示版</span><p>靈感來自 Beli · 非官方作品<br>店家、朋友與地圖均為示範資料</p><button type="button" class="tour-link" data-page="tour">90 秒展示路線 ↗</button><button type="button" class="tour-link" data-reset>重設展示資料</button></div>
  </header>
  <main class="shell" id="main">
    <section id="view" aria-labelledby="view-title"></section>
  </main>
  <p id="status" class="notice" role="status"></p>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="rating-form">
      <header class="modal-title">
        <h2 id="dialog-title"></h2>
        <button type="button" data-close aria-label="關閉評價">×</button>
      </header>
      <section id="details-form">
        <fieldset>
          <legend>這次吃得怎麼樣？</legend>
          <div class="choices">
            <label><input type="radio" name="mood" value="liked" required> 喜歡</label>
            <label><input type="radio" name="mood" value="fine" required> 普通</label>
            <label><input type="radio" name="mood" value="disliked" required> 不喜歡</label>
          </div>
        </fieldset>
        <details id="extras" hidden>
          <summary>加上這餐的細節</summary>
          <label>同行者 <input name="companions" maxlength="80"></label>
          <label>標籤 <input name="tags" maxlength="120" placeholder="例如 早午餐、約會"></label>
          <label>喜歡的菜 <input name="dish" maxlength="80"></label>
          <label>用餐日期 <input name="date" type="date"></label>
          <label>照片 <input name="photo" type="file" accept="image/*"></label>
          <label>筆記 <textarea name="note" maxlength="280" rows="2"></textarea></label>
          <label><input name="hiddenFromActivity" type="checkbox"> 在動態隱藏這次紀錄</label>
        </details>
        <button type="submit" class="primary" disabled>確認評價</button>
      </section>
      <section id="comparison" hidden aria-labelledby="compare-title">
        <h3 id="compare-title" tabindex="-1">你比較喜歡哪一家？</h3>
        <div class="pair"></div>
        <div class="compare-actions">
          <button type="button" data-choice="undo">上一步</button>
          <button type="button" data-choice="tie">一樣喜歡</button>
          <button type="button" data-choice="skip">換一家比較</button>
        </div>
      </section>
      <p id="dialog-error" role="alert"></p>
    </form>
  </dialog>
</body>
</html>
